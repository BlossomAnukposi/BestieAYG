name: BestieAYG CI/CD

# ─── When does this pipeline run? ───────────────────────────────────────────
on:
  push:
    branches: [ main, develop ]   # runs on every push to main or develop
  pull_request:
    branches: [ main, develop ]   # runs on every PR targeting main or develop

# ─── Jobs ────────────────────────────────────────────────────────────────────
jobs:

  # ═══════════════════════════════════════════════════════════════════
  # JOB 1: Lint  (catches style issues and XML/resource errors)
  # Module requirement: "linter" ✅
  # ═══════════════════════════════════════════════════════════════════
  lint:
    name: 🔍 Android Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with secrets
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> local.properties

      - name: Run Android Lint
        run: ./gradlew lint

      - name: Upload Lint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html


  # ═══════════════════════════════════════════════════════════════════
  # JOB 2: Static Code Analysis with Detekt
  # Module requirement: "static code analysis" ✅
  # ═══════════════════════════════════════════════════════════════════
  static-analysis:
    name: 🛡️ Detekt Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with secrets
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> local.properties

      - name: Run Detekt
        run: ./gradlew detekt

      - name: Upload Detekt Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/


  # ═══════════════════════════════════════════════════════════════════
  # JOB 3: Unit Tests
  # Module requirement: "minimal (unit) testing" ✅
  # ═══════════════════════════════════════════════════════════════════
  unit-tests:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with secrets
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> local.properties

      - name: Run Unit Tests
        run: ./gradlew test

      - name: Upload Test Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/


  # ═══════════════════════════════════════════════════════════════════
  # JOB 4: Build Debug APK
  # Module requirement: "the street can build the application" ✅
  # Runs only after lint, static analysis, and tests all pass
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: 🔨 Build Debug APK
    runs-on: ubuntu-latest
    needs: [ lint, static-analysis, unit-tests ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Create local.properties with secrets
        run: |
          echo "OPENWEATHER_API_KEY=${{ secrets.OPENWEATHER_API_KEY }}" >> local.properties

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bestieayg-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk


  # ═══════════════════════════════════════════════════════════════════
  # JOB 5: Dependency Vulnerability Check
  # OWASP Dependency Check scans your libraries for known CVEs.
  # Mention this in the pentest report as part of your SSDLC.
  # ═══════════════════════════════════════════════════════════════════
  dependency-check:
    name: 🔒 OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'BestieAYG'
          path: '.'
          format: 'HTML'
          out: 'reports'

      - name: Upload Dependency Check Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
