name: BestieAYG CI/CD

# Runs on every push/PR to main or develop.
# Download the built APK from: Actions → latest run → Artifacts → bestieayg-apk

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  JAVA_VERSION: '17'

jobs:

  # ═══════════════════════════════════════════════════════════════════
  # JOB 1: Android Lint
  # ═══════════════════════════════════════════════════════════════════
  lint:
    name: "🔍 Android Lint"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Skip the Android Emulator install (tools meta-package).
      # We don't run instrumented tests in CI, so the emulator is unused
      # and its download from Google's CDN is flaky (ZipFile unknown archive).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Prepare Android project
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Run Android Lint
        run: ./gradlew lint

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  # ═══════════════════════════════════════════════════════════════════
  # JOB 2: Detekt static analysis
  # ═══════════════════════════════════════════════════════════════════
  static-analysis:
    name: Detekt Static Analysis
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Skip the Android Emulator install (tools meta-package).
      # We don't run instrumented tests in CI, so the emulator is unused
      # and its download from Google's CDN is flaky (ZipFile unknown archive).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Prepare Android project
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Run Detekt
        run: ./gradlew detekt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: detekt-report
          path: app/build/reports/detekt/

  # ═══════════════════════════════════════════════════════════════════
  # JOB 3: Unit tests
  # ═══════════════════════════════════════════════════════════════════
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Skip the Android Emulator install (tools meta-package).
      # We don't run instrumented tests in CI, so the emulator is unused
      # and its download from Google's CDN is flaky (ZipFile unknown archive).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Prepare Android project
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

  # ═══════════════════════════════════════════════════════════════════
  # JOB 4: Build APK package (rubric requirement)
  # Produces a downloadable debug APK after lint, detekt, and tests pass.
  # ═══════════════════════════════════════════════════════════════════
  build:
    name: Build APK Package
    runs-on: ubuntu-latest
    needs: [ lint, static-analysis, unit-tests ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      # Skip the Android Emulator install (tools meta-package).
      # We don't run instrumented tests in CI, so the emulator is unused
      # and its download from Google's CDN is flaky (ZipFile unknown archive).
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Prepare Android project
        run: |
          chmod +x ./gradlew
          echo "sdk.dir=${ANDROID_SDK_ROOT}" >> local.properties
          echo "${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}" | base64 -d > app/google-services.json

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for download
        run: |
          mkdir -p app/build/package
          cp app/build/outputs/apk/debug/app-debug.apk \
            "app/build/package/bestieayg-${GITHUB_SHA::7}-debug.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: bestieayg-apk
          path: app/build/package/*.apk
          retention-days: 30

      - name: Package summary
        run: |
          echo "## APK package built" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Download **bestieayg-apk** from the Artifacts section of this workflow run." >> "$GITHUB_STEP_SUMMARY"
          ls -lh app/build/package/

  # ═══════════════════════════════════════════════════════════════════
  # JOB 5: OWASP dependency vulnerability scan
  # ═══════════════════════════════════════════════════════════════════
  dependency-check:
    name: OWASP Dependency Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dependency-check/Dependency-Check_Action@main
        with:
          project: BestieAYG
          path: .
          format: HTML
          out: reports

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/
